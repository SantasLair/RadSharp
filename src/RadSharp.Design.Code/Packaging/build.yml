name: Build

# One push builds a native (NativeAOT) package per OS. The app's name, version and bundle id come from the .csproj
# (AssemblyName, Version, Product, BundleId); nothing is hard-coded here.
#
#   Windows  <app>-<version>-win-x64.zip            exe with icon + version resource
#   macOS    <app>-<version>-osx-arm64.zip / -osx-x64.zip   <Product>.app bundle (Info.plist, .icns)
#   Linux    <app>-<version>-linux-x64.tar.gz       exe, libs, .desktop file, PNG icon
#            <app>-<version>-linux-x64.AppImage     best effort; the tarball is the guaranteed Linux artifact
#
# Every push builds (all three OS jobs); to build less often, narrow the `on:` triggers below (for example to tags).
#
# Signing runs only when these repository secrets exist (Settings > Secrets and variables > Actions). Secrets are
# exposed only to the steps that need them, never to `dotnet publish` (which runs the project's MSBuild targets and
# analyzers); a first step per job turns "is the secret set?" into a flag that later steps test.
#   Windows: WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD, optional WINDOWS_TIMESTAMP_URL
#   macOS:   MACOS_CERT (base64 .p12 of a Developer ID Application certificate), MACOS_CERT_PASSWORD,
#            MACOS_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)")
#   notarization (needs the macOS secrets too): APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.read.outputs.project }}
      name: ${{ steps.read.outputs.name }}
      version: ${{ steps.read.outputs.version }}
      product: ${{ steps.read.outputs.product }}
      bundle_id: ${{ steps.read.outputs.bundle_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: read
        shell: bash
        run: |
          shopt -s nullglob
          projs=(./*.csproj)
          if [ "${#projs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .csproj in the repository root, found ${#projs[@]}: ${projs[*]:-none}"
            exit 1
          fi
          proj="${projs[0]}"
          get() { dotnet msbuild "$proj" -getProperty:"$1" -nologo | tr -d '\r'; }
          echo "project=$(basename "$proj")" >> "$GITHUB_OUTPUT"
          echo "name=$(get AssemblyName)" >> "$GITHUB_OUTPUT"
          echo "version=$(get Version)" >> "$GITHUB_OUTPUT"
          echo "product=$(get Product)" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$(get BundleId)" >> "$GITHUB_OUTPUT"

  windows:
    needs: meta
    runs-on: windows-latest
    env:
      NAME: ${{ needs.meta.outputs.name }}
      PROJECT: ${{ needs.meta.outputs.project }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (NativeAOT)
        shell: bash
        run: dotnet publish "$PROJECT" -c Release -r win-x64 -o out
      - name: Is a Windows certificate configured?
        id: wincert
        shell: bash
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          if [ -n "$WINDOWS_CERT_PFX" ]; then echo "has_cert=true" >> "$GITHUB_OUTPUT"; else echo "has_cert=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sign the exe (only when WINDOWS_CERT_PFX is set)
        if: steps.wincert.outputs.has_cert == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found on this runner' }
          $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $exe = "out\$($env:NAME).exe"
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr $timestamp /td sha256 $exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool sign failed' }
          & $signtool.FullName verify /pa $exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool verify failed' }
          Remove-Item $pfx
      - name: Zip the publish folder
        shell: pwsh
        run: |
          Remove-Item out\*.pdb -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out\* -DestinationPath "dist\$($env:NAME)-$($env:VERSION)-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.name }}-${{ needs.meta.outputs.version }}-win-x64
          path: dist/*.zip
          if-no-files-found: error

  macos:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      NAME: ${{ needs.meta.outputs.name }}
      PROJECT: ${{ needs.meta.outputs.project }}
      VERSION: ${{ needs.meta.outputs.version }}
      PRODUCT: ${{ needs.meta.outputs.product }}
      BUNDLE_ID: ${{ needs.meta.outputs.bundle_id }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish (NativeAOT)
        shell: bash
        run: dotnet publish "$PROJECT" -c Release -r "$RID" -o out
      - name: Build the .app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="dist/$PRODUCT.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R out/. "$app/Contents/MacOS/"
          rm -rf "$app"/Contents/MacOS/*.dSYM
          short_version="${VERSION%%[-+]*}"
          # Values from the .csproj go into XML: escape & < > " '.
          xml() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g' -e "s/'/\&apos;/g"; }
          x_name="$(xml "$NAME")"; x_bundle_id="$(xml "$BUNDLE_ID")"; x_product="$(xml "$PRODUCT")"; x_version="$(xml "$short_version")"
          icon_key=""
          if [ -f app.png ]; then
            iconset="$RUNNER_TEMP/$NAME.iconset"
            mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" app.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
              sips -z "$((size * 2))" "$((size * 2))" app.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/$NAME.icns"
            icon_key="  <key>CFBundleIconFile</key><string>$x_name</string>"
          else
            echo "::warning::app.png not found; the bundle has no icon"
          fi
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>$x_name</string>
            <key>CFBundleIdentifier</key><string>$x_bundle_id</string>
            <key>CFBundleName</key><string>$x_product</string>
            <key>CFBundleDisplayName</key><string>$x_product</string>
            <key>CFBundleShortVersionString</key><string>$x_version</string>
            <key>CFBundleVersion</key><string>$x_version</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          $icon_key
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
      - name: Which macOS secrets are configured?
        id: maccert
        shell: bash
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -n "$MACOS_CERT" ]; then echo "has_cert=true" >> "$GITHUB_OUTPUT"; else echo "has_cert=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$MACOS_CERT" ] && [ -n "$APPLE_ID" ]; then echo "has_notary=true" >> "$GITHUB_OUTPUT"; else echo "has_notary=false" >> "$GITHUB_OUTPUT"; fi
      - name: Import the signing certificate (only when MACOS_CERT is set)
        if: steps.maccert.outputs.has_cert == 'true'
        shell: bash
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
      - name: Sign the bundle (Developer ID when MACOS_CERT is set, else ad-hoc)
        shell: bash
        env:
          HAS_CERT: ${{ steps.maccert.outputs.has_cert }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          app="dist/$PRODUCT.app"
          if [ "$HAS_CERT" = "true" ]; then
            find "$app" -name '*.dylib' -exec codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" {} \;
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Notarize and staple (only when the Apple ID secrets are set)
        if: steps.maccert.outputs.has_notary == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          app="dist/$PRODUCT.app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$app"
      - name: Zip the bundle
        shell: bash
        run: ditto -c -k --keepParent "dist/$PRODUCT.app" "dist/$NAME-$VERSION-$RID.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.name }}-${{ needs.meta.outputs.version }}-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: meta
    runs-on: ubuntu-latest
    env:
      NAME: ${{ needs.meta.outputs.name }}
      PROJECT: ${{ needs.meta.outputs.project }}
      VERSION: ${{ needs.meta.outputs.version }}
      PRODUCT: ${{ needs.meta.outputs.product }}
      # appimagetool 1.9.0, x86_64 (sha256 of the release asset).
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Native toolchain for NativeAOT
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish (NativeAOT)
        run: dotnet publish "$PROJECT" -c Release -r linux-x64 -o out
      - name: Tarball with .desktop file and icon
        run: |
          set -euo pipefail
          base="$NAME-$VERSION-linux-x64"
          mkdir -p "dist/$base"
          cp -R out/. "dist/$base/"
          rm -f "dist/$base"/*.dbg
          if [ -f app.png ]; then cp app.png "dist/$base/$NAME.png"; fi
          cat > "dist/$base/$NAME.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=$PRODUCT
          Exec=$NAME
          Icon=$NAME
          Categories=Utility;
          Terminal=false
          DESKTOP
          chmod +x "dist/$base/$NAME"
          tar -C dist -czf "dist/$base.tar.gz" "$base"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.meta.outputs.name }}-${{ needs.meta.outputs.version }}-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
      # Best effort: a failure here (download, FUSE, appimagetool) does not fail the build; the tarball above is the
      # guaranteed Linux artifact.
      - name: AppImage (best effort)
        id: appimage
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
          appdir="$RUNNER_TEMP/$NAME.AppDir"
          mkdir -p "$appdir/usr/bin"
          cp -R out/. "$appdir/usr/bin/"
          rm -f "$appdir"/usr/bin/*.dbg
          chmod +x "$appdir/usr/bin/$NAME"
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/%s" "$@"\n' "$NAME" > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          if [ -f app.png ]; then
            cp app.png "$appdir/$NAME.png"
            cp app.png "$appdir/.DirIcon"
          fi
          cat > "$appdir/$NAME.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=$PRODUCT
          Exec=$NAME
          Icon=$NAME
          Categories=Utility;
          Terminal=false
          DESKTOP
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" "$appdir" "dist/$NAME-$VERSION-linux-x64.AppImage"
      - uses: actions/upload-artifact@v4
        if: steps.appimage.outcome == 'success'
        with:
          name: ${{ needs.meta.outputs.name }}-${{ needs.meta.outputs.version }}-linux-x64-appimage
          path: dist/*.AppImage
          if-no-files-found: warn
