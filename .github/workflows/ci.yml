name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test (layout vectors, golden images, input, editors, generators, designer)
        run: dotnet test --configuration Release
      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: tests/**/golden-failures/
      - name: NativeAOT builds of the samples
        shell: bash
        run: |
          for s in Hello Calculator TextEditor SettingsDialog TileEditor; do
            dotnet publish samples/$s --configuration Release --use-current-runtime --output artifacts/samples/$s
          done
      - name: Designer (self-contained; it hosts Roslyn, so it runs on the JIT)
        run: dotnet publish src/RadSharp.Designer --configuration Release --use-current-runtime --self-contained --output artifacts/designer
      - uses: actions/upload-artifact@v4
        with:
          name: designer-${{ matrix.os }}
          path: artifacts/designer/

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: |
          dotnet pack src/RadSharp.Core --configuration Release
          dotnet pack src/RadSharp.Platform.Sdl --configuration Release
          dotnet pack templates/RadSharp.Templates.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/
