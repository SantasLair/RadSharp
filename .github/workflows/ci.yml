name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # A separate build: `dotnet test` only builds the test projects and what they reference, so a sample that no
      # longer compiles (e.g. a member that now hides a new Form member) would only show up in the publish step below,
      # and only for the samples that step publishes.
      - name: Build (the whole solution, samples included)
        run: dotnet build RadSharp.slnx --configuration Release
      - name: Test (layout vectors, golden images, input, editors, generators, designer)
        # A hung test fails after 5 minutes and names itself (blame-hang) instead of holding the job for hours.
        run: dotnet test RadSharp.slnx --configuration Release --no-build --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
        timeout-minutes: 30
      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: tests/**/golden-failures/
      - name: NativeAOT builds of the samples
        shell: bash
        run: |
          for s in Hello Calculator TextEditor SettingsDialog TileEditor; do
            dotnet publish samples/$s --configuration Release --use-current-runtime --output artifacts/samples/$s
          done
      - name: Designer (self-contained; it hosts Roslyn, so it runs on the JIT)
        run: dotnet publish src/RadSharp.Designer --configuration Release --use-current-runtime --self-contained --output artifacts/designer
      - uses: actions/upload-artifact@v4
        with:
          name: designer-${{ matrix.os }}
          path: artifacts/designer/

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack
        run: sh ./pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/
