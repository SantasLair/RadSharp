name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test (layout vectors, golden images)
        run: dotnet test --configuration Release
      - name: Upload golden-image failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: tests/**/golden-failures/
      - name: NativeAOT smoke build
        run: dotnet publish samples/Hello --configuration Release --use-current-runtime --output artifacts/hello
